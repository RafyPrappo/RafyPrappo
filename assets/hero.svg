    <rect x="96" y="22" width="14" height="48" rx="2" fill="#06b6d4" fill-opacity="0.8" />
    <rect x="120" y="34" width="14" height="36" rx="2" fill="#06b6d4" fill-opacity="0.65" />
    <rect x="144" y="14" width="14" height="56" rx="2" fill="#06b6d4" fill-opacity="0.88" />
    <rect x="168" y="30" width="14" height="40" rx="2" fill="#06b6d4" fill-opacity="0.7" />
    <rect x="192" y="18" width="14" height="52" rx="2" fill="#06b6d4" fill-opacity="0.85" />
    <rect x="216" y="8" width="14" height="62" rx="2" fill="#06b6d4" fill-opacity="0.95" />
    <rect x="240" y="20" width="14" height="50" rx="2" fill="#06b6d4" fill-opacity="0.85" />
    <rect x="264" y="12" width="14" height="58" rx="2" fill="#06b6d4" fill-opacity="0.92" />
  </g>

  
  <g transform="translate(551, 202)" fill="#71717a" font-size="8.5" text-anchor="middle" class="mono">
    <text x="0">D</text>
    <text x="24">J</text>
    <text x="48">F</text>
    <text x="72">M</text>
    <text x="96">A</text>
    <text x="120">M</text>
    <text x="144">J</text>
    <text x="168">J</text>
    <text x="192">A</text>
    <text x="216">S</text>
    <text x="240">O</text>
    <text x="264">N</text>
  </g>

  
  <rect x="528" y="220" width="314" height="36" rx="9" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  <text x="542" y="242" fill="#71717a" font-size="10" class="mono">BUILDING:</text>
  <text x="606" y="242" fill="#f4f4f5" font-size="10.5" font-weight="600" class="mono">Block Fall (Unity)</text>

  
  <rect x="780" y="228" width="52" height="20" rx="4" fill="#09090b" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1" />
  <text x="806" y="241" text-anchor="middle" fill="#06b6d4" font-size="9" font-weight="600" letter-spacing="0.8" class="mono">IN DEV</text>
</svg>