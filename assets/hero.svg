<svg width="900" height="300" viewBox="0 0 900 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <radialGradient id="cardGlow" cx="685" cy="60" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="topHighlight" x1="510" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="35%" stop-color="#06b6d4" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#06b6d4" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    
    <clipPath id="cardClip">
      <rect x="510" y="28" width="350" height="244" rx="14" />
    </clipPath>

    <style>
      .mono { font-family: ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
      .display { font-family: 'Bebas Neue', Impact, 'Arial Narrow', -apple-system, sans-serif; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }

      .ping { animation: pingAnim 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
      .sheen { animation: sheenSweep 5.5s ease-in-out infinite; }

      @keyframes pingAnim {
        0% { opacity: 0.85; }
        70%, 100% { opacity: 0.15; }
      }

      @keyframes sheenSweep {
        0% { transform: translate(-220px, -180px) rotate(-35deg); }
        24%, 100% { transform: translate(380px, 320px) rotate(-35deg); }
      }
    </style>
  </defs>

  
  <rect x="1" y="1" width="898" height="298" rx="16" fill="#09090b" stroke="#27272a" stroke-width="1.2" />

  
  <rect x="1" y="1" width="898" height="298" rx="16" fill="url(#cardGlow)" />

  
  
  <text x="44" y="54" fill="#06b6d4" font-size="11.5" font-weight="600" letter-spacing="2.2" class="mono">// SOFTWARE ENGINEER · CSE '26</text>

  
  <text x="42" y="132" fill="none" stroke="#f4f4f5" stroke-opacity="0.88" stroke-width="1.8" font-size="78" font-weight="700" letter-spacing="3" class="display">ARRAFY</text>
  <text x="42" y="202" fill="#06b6d4" font-size="78" font-weight="700" letter-spacing="3" class="display">PRAPPO<tspan fill="#ffffff" fill-opacity="0.9">.</tspan></text>

  
  <text x="44" y="238" fill="#f4f4f5" fill-opacity="0.85" font-size="13.5" font-weight="500" class="sans">Enterprise systems, workflow automation,</text>
  <text x="44" y="258" fill="#a1a1aa" font-size="13.5" font-weight="400" class="sans">full-stack software, and gamification.</text>

  
  <rect x="510" y="28" width="350" height="244" rx="14" fill="#0c0c0f" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1" />

  
  <rect x="510" y="28" width="350" height="2" rx="1" fill="url(#topHighlight)" />

  
  <g clip-path="url(#cardClip)">
    <rect x="460" y="0" width="460" height="58" fill="url(#sheenGrad)" class="sheen" />
  </g>

  
  <circle cx="534" cy="54" r="5.5" fill="#06b6d4" fill-opacity="0.35" class="ping" />
  <circle cx="534" cy="54" r="3" fill="#06b6d4" />
  <text x="548" y="58" fill="#f4f4f5" font-size="10.5" font-weight="600" letter-spacing="1.6" class="mono">SYS.ONLINE</text>
  <text x="840" y="58" text-anchor="end" fill="#a1a1aa" font-size="10.5" letter-spacing="1.2" class="mono">DHAKA · GMT+6</text>
  <line x1="528" y1="72" x2="842" y2="72" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  
  <text x="530" y="96" fill="#a1a1aa" font-size="10" letter-spacing="1.3" class="mono">GITHUB VELOCITY (12M)</text>
  <text x="840" y="96" text-anchor="end" fill="#71717a" font-size="10" class="mono">@RafyPrappo</text>

  
  <rect x="528" y="106" width="314" height="102" rx="10" fill="#050507" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  
  <g transform="translate(544, 122)">
    <rect x="0" y="52" width="14" height="18" rx="2" fill="#06b6d4" fill-opacity="0.45" />
    <rect x="24" y="40" width="14" height="30" rx="2" fill="#06b6d4" fill-opacity="0.6" />
    <rect x="48" y="28" width="14" height="42" rx="2" fill="#06b6d4" fill-opacity="0.75" />
